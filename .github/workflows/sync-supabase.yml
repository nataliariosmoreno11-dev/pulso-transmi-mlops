name: 1 - Collector ETL a Supabase
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pulso-transmi-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PULSO_DATABASE_URL: ${{ secrets.PULSO_DATABASE_URL }}
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[competition]'
      - name: Ejecutar collector incremental
        run: python -m pulso_transmi.sync_observations
