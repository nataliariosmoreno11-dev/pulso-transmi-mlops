name: 1 - Collector ETL y respaldo de entrega
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: pulso-transmi-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PULSO_DATABASE_URL: ${{ secrets.PULSO_DATABASE_URL }}
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
      PULSO_MODEL_VERSION: lightgbm-demand:2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[competition]'
      - name: Ejecutar collector incremental
        id: collector
        run: python -m pulso_transmi.sync_observations
      - name: Reentrenar cuando lleguen datos nuevos
        if: steps.collector.outputs.new_rows != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run retrain.yml --repo "${{ github.repository }}" --ref main
      - name: Respaldo idempotente de predicción y entrega
        env:
          PULSO_SKIP_SYNC: "1"
        run: python -m pulso_transmi.submit_current_cycle
