name: 4 - Torneo y reentrenamiento
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pulso-transmi-retrain
  cancel-in-progress: false
jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PULSO_DATABASE_URL: ${{ secrets.PULSO_DATABASE_URL }}
      MLFLOW_TRACKING_URI: ${{ secrets.PULSO_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[ml,competition,tracking]'
      - name: Evaluar candidatos y promover ganador
        run: python -m pulso_transmi.model_tournament
      - name: Registrar métricas en MLflow privado
        run: python -m pulso_transmi.log_mlflow
      - name: Guardar reporte del torneo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torneo-modelos-${{ github.run_id }}
          path: artifacts/tournament.latest.json
          if-no-files-found: error
      - name: Publicar modelo mejorado
        run: |
          if git diff --quiet -- artifacts/lightgbm_demand.joblib artifacts/lightgbm_demand.metrics.json; then
            echo "El campeón actual sigue siendo mejor."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/lightgbm_demand.joblib artifacts/lightgbm_demand.metrics.json
          git commit -m "Promote tournament model [skip ci]"
          # Otro workflow o un cambio manual puede avanzar main mientras entrena.
          # Integramos esos commits antes de publicar el artefacto generado.
          git pull --rebase origin main
          git push origin HEAD:main
