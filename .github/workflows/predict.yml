name: Pulso TransMi - predecir y entregar
on:
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validar el pipeline sin enviar a la API"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pulso-transmi-predict
  cancel-in-progress: false
jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PULSO_DATABASE_URL: ${{ secrets.PULSO_DATABASE_URL }}
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
      PULSO_MODEL_VERSION: lightgbm-demand:2.0
      PULSO_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[competition]'
      - name: Comprobar secretos
        run: test -n "$PULSO_DATABASE_URL" && test -n "$PULSO_API_KEY"
      - name: Actualizar, predecir y entregar
        run: python -m pulso_transmi.submit_current_cycle
