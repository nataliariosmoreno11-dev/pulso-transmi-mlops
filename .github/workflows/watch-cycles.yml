name: 2 - Vigilar ciclos y entregar
on:
  schedule:
    - cron: "19 */4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pulso-transmi-cycle-watcher
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    env:
      PULSO_DATABASE_URL: ${{ secrets.PULSO_DATABASE_URL }}
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[competition]'
      - name: Vigilar ciclos hasta el siguiente inicio programado
        run: bash scripts/watch_cycles.sh
