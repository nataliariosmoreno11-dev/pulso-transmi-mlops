name: 2 - Vigilar ciclos y entregar
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pulso-transmi-cycle-watcher
  cancel-in-progress: true
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      PULSO_DATABASE_URL: ${{ secrets.PULSO_DATABASE_URL }}
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[competition]'
      - name: Comprobar y entregar una vez
        run: python -m pulso_transmi.submit_current_cycle
