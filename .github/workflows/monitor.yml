name: 3 - Monitorear accuracy y drift
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pulso-transmi-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PULSO_DATABASE_URL: ${{ secrets.PULSO_DATABASE_URL }}
      PULSO_MODEL_VERSION: lightgbm-demand:595220d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[competition]'
      - name: Calcular desempeño y decidir reentrenamiento
        run: python -m pulso_transmi.monitor_performance
